name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate-build-test:
    runs-on: ${{ matrix.test_destination.runner }}
    strategy:
      fail-fast: false
      matrix:
        test_destination:
          - runner: macos-15
            xcode_version: "26.3"
            xcode_path: /Applications/Xcode_26.3.app
            ios_version: "18.5"
            device: "iPhone 16 Pro"
          - runner: macos-26
            xcode_version: "26.6"
            xcode_path: /Applications/Xcode_26.6.app
            ios_version: "26.2"
            device: "iPhone 17 Pro"
    env:
      SCHEME_NAME: "WrapKit"

    steps:
      # -----------------------------
      # Checkout Code
      # -----------------------------
      - name: Checkout Code
        uses: actions/checkout@v5

      # -----------------------------
      # Select Xcode
      # -----------------------------
      - name: Select Xcode ${{ matrix.test_destination.xcode_version }}
        shell: bash
        run: |
          xcode_path="${{ matrix.test_destination.xcode_path }}"

          if [[ ! -d "$xcode_path" ]]; then
            echo "::error::Xcode not found at $xcode_path"
            exit 1
          fi

          sudo xcode-select -s "$xcode_path"
          xcodebuild -version

      - name: Configure Cache Paths
        shell: bash
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache" >> "$GITHUB_ENV"
          echo "WRAPKIT_CACHE_HOME=$RUNNER_TEMP/wrapkit-cache" >> "$GITHUB_ENV"

      - name: Restore Tuist tool cache
        id: tuist-tool-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wrapkit-cache/tuist
          key: wrapkit-tuist-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'Scripts/ensure-tuist.sh') }}

      - name: Restore SwiftPM dependency cache
        id: swiftpm-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xdg-cache/swifterpm
          key: wrapkit-swiftpm-v3-${{ matrix.test_destination.runner }}-${{ runner.arch }}-xcode-${{ matrix.test_destination.xcode_version }}-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved', 'Tuist/Package.registry.resolved', 'Tuist/Package.lock-state', 'Tuist/.swiftpm/configuration/registries.json') }}

      # -----------------------------
      # Install Tools
      # -----------------------------
      - name: Install Tools
        run: |
          brew install sourcery
          brew install swiftgen
          brew install swiftlint
      # -----------------------------
      # Generate / Build
      # -----------------------------
      - name: Run Makefile for Build
        run: make ci-project

      - name: Read SwiftPM install mode
        id: swiftpm-install
        shell: bash
        run: |
          mode="$(cat Tuist/.build/.wrapkit-install-mode 2>/dev/null || true)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # Ensure iOS Simulators
      # -----------------------------
      - name: List Available Simulators / Devices
        run: |
          echo "=== Devices ==="
          xcrun simctl list devices
      # -----------------------------
      # Run Tests
      # macOS 15 image: https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
      # macOS 26 image: https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
      # -----------------------------
      - name: Run Tests on iOS ${{ matrix.test_destination.ios_version }}
        run: |
          xcodebuild clean build test \
            -workspace $SCHEME_NAME.xcworkspace \
            -scheme $SCHEME_NAME \
            -destination "platform=iOS Simulator,name=${{ matrix.test_destination.device }},OS=${{ matrix.test_destination.ios_version }}"

      - name: Save Tuist tool cache
        if: github.ref == 'refs/heads/main' && steps.tuist-tool-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wrapkit-cache/tuist
          key: ${{ steps.tuist-tool-cache.outputs.cache-primary-key }}

      - name: Save Registry dependency cache
        if: github.ref == 'refs/heads/main' && steps.swiftpm-cache.outputs.cache-hit != 'true' && steps.swiftpm-install.outputs.mode == 'registry'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xdg-cache/swifterpm
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      # -----------------------------
      # Upload Snapshot Artifacts
      # -----------------------------
      - name: Collect Snapshot Test Artifacts
        if: failure()
        shell: bash
        run: |
          artifacts_dir="$RUNNER_TEMP/snapshot-test-failures"
          simulator_devices="$HOME/Library/Developer/CoreSimulator/Devices"
          mkdir -p "$artifacts_dir"

          find "$simulator_devices" \
            -path "*/data/Containers/Data/Application/*/tmp/*" \
            -type f \
            \( -name "origin.png" -o -name "diff.png" -o -name "new.png" \) \
            -print0 |
          while IFS= read -r -d '' file; do
            snapshot_name="$(basename "$(dirname "$file")")"
            mkdir -p "$artifacts_dir/$snapshot_name"
            cp "$file" "$artifacts_dir/$snapshot_name/"
          done

      - name: Upload Snapshot Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-test-failures-ios-${{ matrix.test_destination.ios_version }}
          path: ${{ runner.temp }}/snapshot-test-failures
          if-no-files-found: ignore
          retention-days: 10
          
