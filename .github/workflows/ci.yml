name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  domain-platform-build:
    runs-on: macos-26
    env:
      TUIST_VERSION: "4.38.2"
      TUIST_SHA256: "14af45d18de9d3834ea32d4c9e572f8a69bf2c603963e950f4febbf5234d3b30"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Show available SDKs
        run: |
          xcodebuild -showsdks
          xcodebuild -showsdks | grep -E "tvOS|watchOS|visionOS" || {
            echo "::error::На образе нет SDK tvOS/watchOS/visionOS"
            exit 1
          }

      - name: Install Tools
        run: |
          brew install sourcery

          tuist_archive="$RUNNER_TEMP/tuist.zip"
          tuist_directory="$RUNNER_TEMP/tuist-$TUIST_VERSION"
          curl -fsSL \
            "https://github.com/tuist/tuist/releases/download/$TUIST_VERSION/tuist.zip" \
            -o "$tuist_archive"
          echo "$TUIST_SHA256  $tuist_archive" | shasum -a 256 -c -
          rm -rf "$tuist_directory"
          mkdir -p "$tuist_directory"
          unzip -q "$tuist_archive" -d "$tuist_directory"
          chmod +x "$tuist_directory/tuist"
          sudo rm -f /opt/homebrew/bin/tuist
          sudo ln -s "$tuist_directory/tuist" /opt/homebrew/bin/tuist
          tuist version

      - name: Generate code
        run: make codegen

      - name: Check generated code is up to date
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Генеренные файлы расходятся с выводом кодогенерации. Прогони make project локально и закоммить результат."
            exit 1
          fi
          echo "Генеренные файлы актуальны."

      - name: Build WrapKit for all platforms (SPM)
        run: |
          dest_for() {
            case "$1" in
              iOS)         echo "generic/platform=iOS" ;;
              macCatalyst) echo "generic/platform=macOS,variant=Mac Catalyst" ;;
              macOS)       echo "generic/platform=macOS" ;;
              tvOS)        echo "generic/platform=tvOS" ;;
              watchOS)     echo "generic/platform=watchOS" ;;
              visionOS)    echo "generic/platform=visionOS" ;;
            esac
          }
          FAILED=""
          for p in iOS macCatalyst macOS tvOS watchOS visionOS; do
            echo "───────────── SPM / $p"
            START=$(date +%s)
            if xcodebuild build \
                 -workspace .swiftpm/xcode/package.xcworkspace \
                 -scheme WrapKit \
                 -destination "$(dest_for $p)" \
                 -derivedDataPath "$RUNNER_TEMP/dd/spm-$p" \
                 -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache" \
                 -skipPackagePluginValidation -skipMacroValidation \
                 -quiet CODE_SIGNING_ALLOWED=NO > "build-spm-$p.log" 2>&1; then
              echo "SPM $p ✅ $(( $(date +%s) - START ))s"
            else
              echo "SPM $p ❌ $(( $(date +%s) - START ))s"
              grep "error:" "build-spm-$p.log" | sort -u | head -20
              FAILED="$FAILED spm/$p"
            fi
            rm -rf "$RUNNER_TEMP/dd/spm-$p"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Не собрались:$FAILED"
            exit 1
          fi
          echo "Все 6 платформ собрались."

      # Tuist-манифест описывает те же исходники отдельно и тоже заявляет destinations: .all,
      # поэтому расходится с Package.swift незаметно.
      - name: Build WrapKit for all platforms (Tuist)
        run: |
          make project
          dest_for() {
            case "$1" in
              iOS)         echo "generic/platform=iOS" ;;
              macCatalyst) echo "generic/platform=macOS,variant=Mac Catalyst" ;;
              macOS)       echo "generic/platform=macOS" ;;
              tvOS)        echo "generic/platform=tvOS" ;;
              watchOS)     echo "generic/platform=watchOS" ;;
              visionOS)    echo "generic/platform=visionOS" ;;
            esac
          }
          FAILED=""
          for p in iOS macCatalyst macOS tvOS watchOS visionOS; do
            echo "───────────── Tuist / $p"
            START=$(date +%s)
            if xcodebuild build \
                 -workspace Wrapkit.xcworkspace \
                 -scheme WrapKit \
                 -destination "$(dest_for $p)" \
                 -derivedDataPath "$RUNNER_TEMP/dd/tuist-$p" \
                 -skipPackagePluginValidation -skipMacroValidation \
                 -quiet CODE_SIGNING_ALLOWED=NO > "build-tuist-$p.log" 2>&1; then
              echo "Tuist $p ✅ $(( $(date +%s) - START ))s"
            else
              echo "Tuist $p ❌ $(( $(date +%s) - START ))s"
              grep "error:" "build-tuist-$p.log" | sort -u | head -20
              FAILED="$FAILED tuist/$p"
            fi
            rm -rf "$RUNNER_TEMP/dd/tuist-$p"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Не собрались:$FAILED — расхождение Tuist-манифеста с Package.swift"
            exit 1
          fi
          echo "Все 6 платформ собрались через Tuist."

      - name: Upload platform build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: domain-platform-build-logs
          path: build-*.log
          if-no-files-found: ignore
          retention-days: 10

  generate-build-test:
    runs-on: ${{ matrix.test_destination.runner }}
    strategy:
      fail-fast: false
      matrix:
        test_destination:
          - runner: macos-15
            xcode_version: "26.3"
            xcode_path: /Applications/Xcode_26.3.app
            ios_version: "18.5"
            device: "iPhone 16 Pro"
          - runner: macos-26
            xcode_version: "26.6"
            xcode_path: /Applications/Xcode_26.6.app
            ios_version: "26.2"
            device: "iPhone 17 Pro"
    env:
      SCHEME_NAME: "WrapKit"
      TUIST_VERSION: "4.38.2"
      TUIST_SHA256: "14af45d18de9d3834ea32d4c9e572f8a69bf2c603963e950f4febbf5234d3b30"

    steps:
      # -----------------------------
      # Checkout Code
      # -----------------------------
      - name: Checkout Code
        uses: actions/checkout@v5

      # -----------------------------
      # Select Xcode
      # -----------------------------
      - name: Select Xcode ${{ matrix.test_destination.xcode_version }}
        shell: bash
        run: |
          xcode_path="${{ matrix.test_destination.xcode_path }}"

          if [[ ! -d "$xcode_path" ]]; then
            echo "::error::Xcode not found at $xcode_path"
            exit 1
          fi

          sudo xcode-select -s "$xcode_path"
          xcodebuild -version

      # -----------------------------
      # Install Tools
      # -----------------------------
      - name: Install Tools
        run: |
          brew install sourcery
          brew install swiftgen
          brew install swiftlint

          tuist_archive="$RUNNER_TEMP/tuist.zip"
          tuist_directory="$RUNNER_TEMP/tuist-$TUIST_VERSION"
          curl -fsSL \
            "https://github.com/tuist/tuist/releases/download/$TUIST_VERSION/tuist.zip" \
            -o "$tuist_archive"
          echo "$TUIST_SHA256  $tuist_archive" | shasum -a 256 -c -
          rm -rf "$tuist_directory"
          mkdir -p "$tuist_directory"
          unzip -q "$tuist_archive" -d "$tuist_directory"
          chmod +x "$tuist_directory/tuist"
          sudo rm -f /opt/homebrew/bin/tuist
          sudo ln -s "$tuist_directory/tuist" /opt/homebrew/bin/tuist
          tuist version
      # -----------------------------
      # Generate / Build
      # -----------------------------
      - name: Run Makefile for Build
        run: make project

      # -----------------------------
      # Ensure iOS Simulators
      # -----------------------------
      - name: List Available Simulators / Devices
        run: |
          echo "=== Devices ==="
          xcrun simctl list devices
      # -----------------------------
      # Run Tests
      # macOS 15 image: https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
      # macOS 26 image: https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
      # -----------------------------
      - name: Run Tests on iOS ${{ matrix.test_destination.ios_version }}
        run: |
          xcodebuild clean build test \
            -workspace $SCHEME_NAME.xcworkspace \
            -scheme $SCHEME_NAME \
            -destination "platform=iOS Simulator,name=${{ matrix.test_destination.device }},OS=${{ matrix.test_destination.ios_version }}"

      # -----------------------------
      # Upload Snapshot Artifacts
      # -----------------------------
      - name: Collect Snapshot Test Artifacts
        if: failure()
        shell: bash
        run: |
          artifacts_dir="$RUNNER_TEMP/snapshot-test-failures"
          simulator_devices="$HOME/Library/Developer/CoreSimulator/Devices"
          mkdir -p "$artifacts_dir"

          find "$simulator_devices" \
            -path "*/data/Containers/Data/Application/*/tmp/*" \
            -type f \
            \( -name "origin.png" -o -name "diff.png" -o -name "new.png" \) \
            -print0 |
          while IFS= read -r -d '' file; do
            snapshot_name="$(basename "$(dirname "$file")")"
            mkdir -p "$artifacts_dir/$snapshot_name"
            cp "$file" "$artifacts_dir/$snapshot_name/"
          done

      - name: Upload Snapshot Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-test-failures-ios-${{ matrix.test_destination.ios_version }}
          path: ${{ runner.temp }}/snapshot-test-failures
          if-no-files-found: ignore
          retention-days: 10
          
