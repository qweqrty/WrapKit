name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  domain-platform-build:
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Configure Cache Paths
        shell: bash
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache" >> "$GITHUB_ENV"
          echo "WRAPKIT_CACHE_HOME=$RUNNER_TEMP/wrapkit-cache" >> "$GITHUB_ENV"

      - name: Install Tools
        run: |
          brew install sourcery

      - name: Generate code
        run: make codegen

      - name: Check generated code is up to date
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Генеренные файлы расходятся с выводом кодогенерации. Прогони make project локально и закоммить результат."
            exit 1
          fi
          echo "Генеренные файлы актуальны."

      # contents.xcworkspacedata — локальный артефакт Xcode, в git его нет,
      # поэтому в чистом клоне воркспейс пакета приходится создавать самим.
      - name: Prepare SPM workspace
        run: |
          mkdir -p .swiftpm/xcode/package.xcworkspace
          cat > .swiftpm/xcode/package.xcworkspace/contents.xcworkspacedata <<'XCWS'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace version = "1.0">
             <FileRef location = "self:"></FileRef>
          </Workspace>
          XCWS
          cat .swiftpm/xcode/package.xcworkspace/contents.xcworkspacedata

      - name: Check platform availability
        run: |
          DESTS=$(xcodebuild -showdestinations -workspace .swiftpm/xcode/package.xcworkspace -scheme WrapKit 2>/dev/null)
          MISSING=""
          for p in tvOS watchOS visionOS; do
            LINE=$(echo "$DESTS" | grep "name:Any $p Device")
            if [ -z "$LINE" ] || echo "$LINE" | grep -q "error:"; then
              MISSING="$MISSING $p"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::На образе недоступны платформы:$MISSING"
            exit 1
          fi
          echo "Платформы tvOS, watchOS и visionOS доступны."

      - name: Build WrapKit for all platforms (SPM)
        run: |
          dest_for() {
            case "$1" in
              iOS)         echo "generic/platform=iOS" ;;
              macCatalyst) echo "generic/platform=macOS,variant=Mac Catalyst" ;;
              macOS)       echo "generic/platform=macOS" ;;
              tvOS)        echo "generic/platform=tvOS" ;;
              watchOS)     echo "generic/platform=watchOS" ;;
              visionOS)    echo "generic/platform=visionOS" ;;
            esac
          }
          FAILED=""
          for p in iOS macCatalyst macOS tvOS watchOS visionOS; do
            # DerivedData общий на платформу: WrapKit собирается один раз,
            # WrapKitTestUtils переиспользует его модули.
            for s in WrapKit WrapKitTestUtils; do
              echo "───────────── SPM / $p / $s"
              START=$(date +%s)
              if xcodebuild build \
                   -workspace .swiftpm/xcode/package.xcworkspace \
                   -scheme "$s" \
                   -destination "$(dest_for $p)" \
                   -derivedDataPath "$RUNNER_TEMP/dd/spm-$p" \
                   -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache" \
                   -skipPackagePluginValidation -skipMacroValidation \
                   -quiet CODE_SIGNING_ALLOWED=NO > "build-spm-$p-$s.log" 2>&1; then
                echo "SPM $p / $s ✅ $(( $(date +%s) - START ))s"
              else
                echo "SPM $p / $s ❌ $(( $(date +%s) - START ))s"
                grep "error:" "build-spm-$p-$s.log" | sort -u | head -20
                FAILED="$FAILED spm/$p/$s"
              fi
            done
            rm -rf "$RUNNER_TEMP/dd/spm-$p"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Не собрались:$FAILED"
            exit 1
          fi
          echo "Все 6 платформ собрались."

      # Tuist-манифест описывает те же исходники отдельно и тоже заявляет destinations: .all,
      # поэтому расходится с Package.swift незаметно.
      - name: Build WrapKit for all platforms (Tuist)
        run: |
          make ci-project
          dest_for() {
            case "$1" in
              iOS)         echo "generic/platform=iOS" ;;
              macCatalyst) echo "generic/platform=macOS,variant=Mac Catalyst" ;;
              macOS)       echo "generic/platform=macOS" ;;
              tvOS)        echo "generic/platform=tvOS" ;;
              watchOS)     echo "generic/platform=watchOS" ;;
              visionOS)    echo "generic/platform=visionOS" ;;
            esac
          }
          FAILED=""
          for p in iOS macCatalyst macOS tvOS watchOS visionOS; do
            for s in WrapKit WrapKitTestUtils; do
              echo "───────────── Tuist / $p / $s"
              START=$(date +%s)
              if xcodebuild build \
                   -workspace Wrapkit.xcworkspace \
                   -scheme "$s" \
                   -destination "$(dest_for $p)" \
                   -derivedDataPath "$RUNNER_TEMP/dd/tuist-$p" \
                   -skipPackagePluginValidation -skipMacroValidation \
                   -quiet CODE_SIGNING_ALLOWED=NO > "build-tuist-$p-$s.log" 2>&1; then
                echo "Tuist $p / $s ✅ $(( $(date +%s) - START ))s"
              else
                echo "Tuist $p / $s ❌ $(( $(date +%s) - START ))s"
                grep "error:" "build-tuist-$p-$s.log" | sort -u | head -20
                FAILED="$FAILED tuist/$p/$s"
              fi
            done
            rm -rf "$RUNNER_TEMP/dd/tuist-$p"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Не собрались:$FAILED — расхождение Tuist-манифеста с Package.swift"
            exit 1
          fi
          echo "Все 6 платформ собрались через Tuist."

      - name: Upload platform build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: domain-platform-build-logs
          path: build-*.log
          if-no-files-found: ignore
          retention-days: 10

  # SwiftUI app all platform build job
  swiftui-app-platform-build:
    runs-on: macos-26
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Configure Cache Paths
        shell: bash
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache" >> "$GITHUB_ENV"
          echo "WRAPKIT_CACHE_HOME=$RUNNER_TEMP/wrapkit-cache" >> "$GITHUB_ENV"

      - name: Install Tools
        run: |
          brew install sourcery

      - name: Generate project
        run: make ci-project

      - name: Build SwiftUIApp for all platforms
        run: |
          dest_for() {
            case "$1" in
              iOS)         echo "generic/platform=iOS" ;;
              macCatalyst) echo "generic/platform=macOS,variant=Mac Catalyst" ;;
              macOS)       echo "generic/platform=macOS" ;;
              tvOS)        echo "generic/platform=tvOS" ;;
              watchOS)     echo "generic/platform=watchOS" ;;
              visionOS)    echo "generic/platform=visionOS" ;;
            esac
          }
          FAILED=""
          for p in iOS macCatalyst macOS tvOS watchOS visionOS; do
            echo "───────────── SwiftUIApp / $p"
            LOG="build-swiftuiapp-$p.log"
            START=$(date +%s)
            if xcodebuild build \
                 -workspace Wrapkit.xcworkspace \
                 -scheme SwiftUIApp \
                 -destination "$(dest_for $p)" \
                 -derivedDataPath "$RUNNER_TEMP/dd/swiftuiapp" \
                 -skipPackagePluginValidation -skipMacroValidation \
                 -quiet CODE_SIGNING_ALLOWED=NO > "$LOG" 2>&1; then
              echo "SwiftUIApp $p ✅ $(( $(date +%s) - START ))s"
              rm -f "$LOG"
            else
              echo "SwiftUIApp $p ❌ $(( $(date +%s) - START ))s"
              grep "error:" "$LOG" | sort -u | head -50 || true
              FAILED="$FAILED $p"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::warning::SwiftUIApp не собрался на:$FAILED. Ошибки выше в логе шага, полные логи в артефакте swiftui-app-build-logs."
          else
            echo "SwiftUIApp собрался на всех 6 платформах."
          fi

      - name: Upload SwiftUIApp build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swiftui-app-build-logs
          path: build-swiftuiapp-*.log
          if-no-files-found: ignore
          retention-days: 10

  generate-build-test-matrix:
    runs-on: ${{ matrix.test_destination.runner }}
    strategy:
      fail-fast: false
      matrix:
        test_destination:
          - runner: macos-15
            xcode_version: "26.3"
            xcode_path: /Applications/Xcode_26.3.app
            ios_version: "18.5"
            device: "iPhone 16 Pro"
          - runner: macos-26
            xcode_version: "26.6"
            xcode_path: /Applications/Xcode_26.6.app
            ios_version: "26.2"
            device: "iPhone 17 Pro"
    env:
      SCHEME_NAME: "WrapKit"

    steps:
      # -----------------------------
      # Checkout Code
      # -----------------------------
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          # Public dependencies need no repository token during generation or tests.
          persist-credentials: false

      # -----------------------------
      # Select Xcode
      # -----------------------------
      - name: Select Xcode ${{ matrix.test_destination.xcode_version }}
        shell: bash
        run: |
          xcode_path="${{ matrix.test_destination.xcode_path }}"

          if [[ ! -d "$xcode_path" ]]; then
            echo "::error::Xcode not found at $xcode_path"
            exit 1
          fi

          sudo xcode-select -s "$xcode_path"
          xcodebuild -version

      - name: Configure Cache Paths
        shell: bash
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache" >> "$GITHUB_ENV"
          echo "WRAPKIT_CACHE_HOME=$RUNNER_TEMP/wrapkit-cache" >> "$GITHUB_ENV"

      - name: Restore Tuist tool cache
        id: tuist-tool-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wrapkit-cache/tuist
          key: wrapkit-tuist-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'Scripts/ensure-tuist.sh') }}

      - name: Restore SwiftPM dependency cache
        id: swiftpm-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xdg-cache/swifterpm
          key: wrapkit-swiftpm-v3-${{ matrix.test_destination.runner }}-${{ runner.arch }}-xcode-${{ matrix.test_destination.xcode_version }}-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved', 'Tuist/Package.registry.resolved', 'Tuist/Package.lock-state', 'Tuist/.swiftpm/configuration/registries.json') }}

      # -----------------------------
      # Install Tools
      # -----------------------------
      - name: Install Tools
        run: |
          brew install sourcery
          brew install swiftgen
          brew install swiftlint
      # -----------------------------
      # Generate / Build
      # -----------------------------
      - name: Run Makefile for Build
        run: make ci-project

      - name: Read SwiftPM install mode
        id: swiftpm-install
        shell: bash
        run: |
          mode="$(cat Tuist/.build/.wrapkit-install-mode 2>/dev/null || true)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # Ensure iOS Simulators
      # -----------------------------
      - name: List Available Simulators / Devices
        run: |
          echo "=== Devices ==="
          xcrun simctl list devices
      # -----------------------------
      # Run Tests
      # macOS 15 image: https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
      # macOS 26 image: https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
      # -----------------------------
      - name: Run Tests on iOS ${{ matrix.test_destination.ios_version }}
        run: |
          xcodebuild clean build test \
            -workspace $SCHEME_NAME.xcworkspace \
            -scheme $SCHEME_NAME \
            -testLanguage en \
            -testRegion US \
            -destination "platform=iOS Simulator,name=${{ matrix.test_destination.device }},OS=${{ matrix.test_destination.ios_version }}"

      - name: Save Tuist tool cache
        if: github.ref == 'refs/heads/main' && steps.tuist-tool-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wrapkit-cache/tuist
          key: ${{ steps.tuist-tool-cache.outputs.cache-primary-key }}

      - name: Save Registry dependency cache
        if: github.ref == 'refs/heads/main' && steps.swiftpm-cache.outputs.cache-hit != 'true' && steps.swiftpm-install.outputs.mode == 'registry'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xdg-cache/swifterpm
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      # -----------------------------
      # Upload Snapshot Artifacts
      # -----------------------------
      - name: Collect Snapshot Test Artifacts
        if: failure()
        shell: bash
        run: |
          artifacts_dir="$RUNNER_TEMP/snapshot-test-failures"
          simulator_devices="$HOME/Library/Developer/CoreSimulator/Devices"
          mkdir -p "$artifacts_dir"

          find "$simulator_devices" \
            -path "*/data/Containers/Data/Application/*/tmp/*" \
            -type f \
            \( -name "origin.png" -o -name "diff.png" -o -name "new.png" \) \
            -print0 |
          while IFS= read -r -d '' file; do
            snapshot_name="$(basename "$(dirname "$file")")"
            mkdir -p "$artifacts_dir/$snapshot_name"
            cp "$file" "$artifacts_dir/$snapshot_name/"
          done

      - name: Upload Snapshot Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-test-failures-ios-${{ matrix.test_destination.ios_version }}
          path: ${{ runner.temp }}/snapshot-test-failures
          if-no-files-found: ignore
          retention-days: 10

  generate-build-test:
    name: generate-build-test
    if: ${{ always() }}
    needs: generate-build-test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Verify matrix result
        env:
          MATRIX_RESULT: ${{ needs.generate-build-test-matrix.result }}
        run: test "$MATRIX_RESULT" = "success"
          
